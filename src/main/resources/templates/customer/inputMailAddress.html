<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>ユーザーID入力</title>
		<link rel="stylesheet" th:href="@{../css/customer/inputMailAddress.css}">
	</head>
	<body>
		<h1 class="title">ユーザーID入力</h1>
		
		<div th:if="${errorMessage} != null">
			<span th:text="${errorMessage}"></span>
		</div>
		<div th:if="${userIdCheck} != null">
			<span th:text="${userIdCheck}"></span>
		</div>
		
		<p class="explanation"> ※メールアドレスは、ユーザーIDがメールアドレス形式でも入力必須</p>
		<form th:action="@{/mailSend}" method="get" th:object="${customerDto}">
			<label>ユーザーID</label>
			<input type="text" th:field="*{userId}" class="input-mail-address"/><br>
			<label>メールアドレス</label>
			<input type="text" th:field="*{mailAddress}"/>
			<input type="submit" value="メール送信画面へ" class="toMailSend"/>
			<input type="submit" value="ログインへ" formaction="/login" class="toLogin"/>
		</form>
		
	</body>
</html>
