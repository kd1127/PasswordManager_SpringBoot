<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>ユーザー登録完了</title>
		<link rel="stylesheet" th:href="@{../css/login/userRegisterCompletion.css}">
	</head>
	<body>
		<h1 class="title">ユーザー登録完了</h1>
		
		<p class="report">ユーザー登録完了しました</p>
		<p>
			パスキー：
			<span th:text="${passKey}"></span>
		</p>
		
		<form th:action="@{/login}" method="get">			
			<input type="submit" value="ログインへ" class="toLogin"/>
		</form>
	</body>
</html>
