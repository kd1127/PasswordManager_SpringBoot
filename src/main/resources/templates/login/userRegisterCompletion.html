<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>ユーザー登録完了</title>
		<link rel="stylesheet" th:href="@{../css/login/userRegisterCompletion.css}">
	</head>
	<body>
		<h1 class="title">ユーザー登録完了</h1>
		
		<p class="report">ユーザー登録完了しました</p>
		<p>
			パスキー：
			<span th:text="${passKey}"></span>
		</p>
		
		<form th:action="@{/login}" method="get">			
			<input type="submit" value="ログインへ" class="toLogin" id="button"/>
		</form>
	</body>
	<script th:inline="javascript">
		  let flag = false;
		  const button = document.getElementById("button");
	  	  button.addEventListener('click', function(){
		  	  flag = true;
	  	  });
		  window.addEventListener('beforeunload', function(event) {
			  if(flag == true){
				  return;
			  }
			  event.preventDefault();
			  event.returnValue = "";
		  });
		  document.addEventListener("keydown", (event) => {
			  const key = event.key.toLowerCase();
	
			  const isReload =
			    event.key === "F5" ||
			    ((event.ctrlKey || event.metaKey) && key === "r");
	
			  if (isReload) {
			    event.preventDefault();
			  }
			  event.preventDefault();
			  event.returnValue = "";
		});
	</script>
</html>
